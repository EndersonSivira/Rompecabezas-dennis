<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rompecabezas</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* HUD / Marcadores */
    .hud {
      display: flex;
      gap: 20px;
      background-color: var(--card-bg);
      padding: 6px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text);
    }

    /* Tablero Principal (Relación 9:16 vertical) */
    .board-container {
      position: relative;
      width: 100%;
      max-width: 280px;
      aspect-ratio: 9 / 16;
      background-color: #020617;
      border: 3px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
    }

    #board {
      width: 100%;
      height: 100%;
      display: grid;
      position: relative;
    }

    /* Celdas receptoras en el tablero */
    .slot {
      border: 1px dashed rgba(255, 255, 255, 0.15);
      box-sizing: border-box;
      position: relative;
    }

    /* Zona de piezas para armar */
    .pieces-bank {
      width: 100%;
      max-width: 280px;
      min-height: 110px;
      background-color: var(--card-bg);
      border: 2px dashed #475569;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
    }

    /* Piezas sueltas */
    .piece {
      background-repeat: no-repeat;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.3);
      transition: transform 0.1s ease;
    }

    .piece:active {
      cursor: grabbing;
      transform: scale(1.05);
      z-index: 1000;
    }

    .piece.placed {
      cursor: default;
      box-shadow: none;
      border: none;
      border-radius: 0;
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* Modales y Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
      border-radius: 10px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 80%;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    select {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 8px;
      border-radius: 6px;
      margin: 10px 0;
      width: 80%;
      font-size: 0.9rem;
    }

    .win-text {
      color: #4ade80;
      font-size: 1.6rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Rompecabezas</h1>
  </header>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">Tiempo</span>
      <span id="timer" class="hud-value">00:00</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Progreso</span>
      <span id="progress" class="hud-value">0%</span>
    </div>
  </div>

  <!-- Tablero de Destino -->
  <div class="board-container">
    <div id="board"></div>

    <!-- Menú de Inicio -->
    <div id="start-overlay" class="overlay">
      <h2>¡A Jugar!</h2>
      <p style="font-size:0.85rem; color:#94a3b8; margin: 10px 0;">Arrastra las piezas de abajo hacia el tablero para armar la imagen.</p>
      
      <label for="grid-cols" style="font-size:0.8rem;">Dificultad:</label>
      <select id="grid-cols">
        <option value="3">Fácil (3x4 piezas)</option>
        <option value="4" selected>Normal (4x5 piezas)</option>
        <option value="5">Difícil (5x6 piezas)</option>
      </select>

      <button id="start-btn" class="btn">Iniciar</button>
    </div>

    <!-- Victoria -->
    <div id="win-overlay" class="overlay hidden">
      <h2 class="win-text">¡Completado!</h2>
      <p>Tiempo total: <span id="final-time">00:00</span></p>
      <button id="restart-btn" class="btn">Volver a Jugar</button>
    </div>
  </div>

  <!-- Banco de Piezas Desordenadas -->
  <div id="pieces-bank" class="pieces-bank"></div>

  <script>
    // URL de la imagen vertical formato teléfono (9:16)
    const IMAGE_URL = 'https://github.com/EndersonSivira/Rompecabezas-dennis/raw/main/IMG-20260930-WA0021.jpg';

    let cols = 4;
    let rows = 5;
    let totalPieces = 0;
    let placedCount = 0;
    let timerInterval = null;
    let secondsElapsed = 0;
    let draggedPiece = null;

    const boardEl = document.getElementById('board');
    const bankEl = document.getElementById('pieces-bank');
    const timerEl = document.getElementById('timer');
    const progressEl = document.getElementById('progress');
    const startOverlay = document.getElementById('start-overlay');
    const winOverlay = document.getElementById('win-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const gridSelect = document.getElementById('grid-cols');
    const finalTimeEl = document.getElementById('final-time');

    // Web Audio API para efectos de sonido
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'snap') {
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function initGame() {
      cols = parseInt(gridSelect.value);
      rows = cols + 1; // Mantiene el aspecto vertical del teléfono
      totalPieces = cols * rows;
      placedCount = 0;
      secondsElapsed = 0;
      
      progressEl.textContent = '0%';
      timerEl.textContent = '00:00';
      clearInterval(timerInterval);

      boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      boardEl.innerHTML = '';
      bankEl.innerHTML = '';

      const pieces = [];

      // Crear celdas del tablero y generar piezas
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const index = r * cols + c;

          // Crear espacio receptivo en el tablero
          const slot = document.createElement('div');
          slot.classList.add('slot');
          slot.dataset.index = index;
          
          slot.addEventListener('dragover', (e) => e.preventDefault());
          slot.addEventListener('drop', (e) => handleDropOnSlot(e, slot));

          boardEl.appendChild(slot);

          // Crear pieza
          const piece = document.createElement('div');
          piece.classList.add('piece');
          piece.draggable = true;
          piece.dataset.index = index;

          // Dimensiones proporcionales para el banco
          const pieceWidth = Math.floor(260 / cols);
          const pieceHeight = Math.floor((260 * (16 / 9)) / rows);
          piece.style.width = `${pieceWidth}px`;
          piece.style.height = `${pieceHeight}px`;

          // Recorte exacto de la imagen
          const bgPosX = (c / (cols - 1)) * 100;
          const bgPosY = (r / (rows - 1)) * 100;
          piece.style.backgroundImage = `url('${IMAGE_URL}')`;
          piece.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
          piece.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;

          // Eventos para Arrastrar (Mouse y Táctil)
          setupDragEvents(piece);

          pieces.push(piece);
        }
      }

      // Mezclar las piezas en el banco inferior
      pieces.sort(() => Math.random() - 0.5);
      pieces.forEach(p => bankEl.appendChild(p));

      startOverlay.classList.add('hidden');
      winOverlay.classList.add('hidden');
      timerInterval = setInterval(updateTimer, 1000);
    }

    // Configuración Drag & Drop táctil + mouse
    function setupDragEvents(piece) {
      piece.addEventListener('dragstart', (e) => {
        draggedPiece = piece;
        e.dataTransfer.setData('text/plain', piece.dataset.index);
      });

      // Soporte para Pantallas Táctiles (Móviles)
      piece.addEventListener('touchstart', (e) => {
        draggedPiece = piece;
      }, { passive: true });

      piece.addEventListener('touchend', (e) => {
        if (!draggedPiece) return;
        const touch = e.changedTouches[0];
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        const slot = targetEl ? targetEl.closest('.slot') : null;

        if (slot) {
          checkAndPlacePiece(draggedPiece, slot);
        }
        draggedPiece = null;
      });
    }

    function handleDropOnSlot(e, slot) {
      e.preventDefault();
      if (draggedPiece) {
        checkAndPlacePiece(draggedPiece, slot);
      }
    }

    // Encajar pieza si la casilla es la correcta
    function checkAndPlacePiece(piece, slot) {
      const pieceIndex = piece.dataset.index;
      const slotIndex = slot.dataset.index;

      // Solo encaja si es el lugar correcto y está vacío
      if (pieceIndex === slotIndex && slot.children.length === 0) {
        piece.classList.add('placed');
        piece.draggable = false;
        slot.appendChild(piece);
        
        placedCount++;
        playSound('snap');

        const percentage = Math.floor((placedCount / totalPieces) * 100);
        progressEl.textContent = `${percentage}%`;

        if (placedCount === totalPieces) {
          handleWin();
        }
      }
    }

    function updateTimer() {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
    }

    function handleWin() {
      clearInterval(timerInterval);
      playSound('win');
      finalTimeEl.textContent = timerEl.textContent;
      winOverlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);
  </script>
</body>
</html>
