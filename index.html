<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rompecabezas</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* HUD / Marcadores */
    .hud {
      display: flex;
      gap: 20px;
      background-color: var(--card-bg);
      padding: 6px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text);
    }

    /* Tablero Principal (Relación 9:16 vertical) */
    .board-container {
      position: relative;
      width: 100%;
      max-width: 280px;
      aspect-ratio: 9 / 16;
      background-color: #020617;
      border: 3px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
    }

    #board {
      width: 100%;
      height: 100%;
      display: grid;
      position: relative;
    }

    /* Celdas receptoras en el tablero */
    .slot {
      border: 1px dashed rgba(255, 255, 255, 0.15);
      box-sizing: border-box;
      position: relative;
      cursor: pointer;
    }

    .slot:hover {
      background-color: rgba(56, 189, 248, 0.1);
    }

    /* Zona de piezas para armar */
    .pieces-bank {
      width: 100%;
      max-width: 280px;
      min-height: 110px;
      background-color: var(--card-bg);
      border: 2px dashed #475569;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
    }

    /* Piezas sueltas */
    .piece {
      background-repeat: no-repeat;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      border-radius: 4px;
      border: 2px solid rgba(255,255,255,0.3);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    /* Estado cuando la pieza está seleccionada */
    .piece.selected {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 12px #38bdf8;
      transform: scale(1.1);
      z-index: 100;
    }

    .piece.placed {
      cursor: default;
      box-shadow: none;
      border: none;
      border-radius: 0;
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      transform: none !important;
    }

    /* Modales y Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      text-align: center;
      z-index: 10;
      border-radius: 10px;
    }

    .hidden {
      display: none !important;
    }

    /* Selector de imágenes / Galería desplazable */
    .puzzle-selector {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      width: 100%;
      overflow-x: auto;
      padding: 10px 5px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .puzzle-selector::-webkit-scrollbar {
      height: 6px;
    }

    .puzzle-selector::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .puzzle-thumb {
      flex: 0 0 55px;
      height: 85px;
      border-radius: 6px;
      border: 2px solid #475569;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .puzzle-thumb:hover {
      transform: scale(1.05);
    }

    .puzzle-thumb.active {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 80%;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .win-text {
      color: #4ade80;
      font-size: 1.6rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Rompecabezas</h1>
  </header>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">Tiempo</span>
      <span id="timer" class="hud-value">00:00</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Progreso</span>
      <span id="progress" class="hud-value">0%</span>
    </div>
  </div>

  <!-- Tablero de Destino -->
  <div class="board-container">
    <div id="board"></div>

    <!-- Menú de Inicio -->
    <div id="start-overlay" class="overlay">
      <h2>Selecciona Imagen</h2>
      <p style="font-size:0.8rem; color:#94a3b8; margin-top: 5px;">Desliza para ver las 10 imágenes</p>
      
      <!-- Selector de Rompecabezas (10 opciones) -->
      <div id="puzzle-selector" class="puzzle-selector"></div>

      <button id="start-btn" class="btn">Iniciar Juego</button>
    </div>

    <!-- Victoria -->
    <div id="win-overlay" class="overlay hidden">
      <h2 class="win-text">¡Completado!</h2>
      <p>Tiempo total: <span id="final-time">00:00</span></p>
      <button id="restart-btn" class="btn">Menú Principal</button>
    </div>
  </div>

  <!-- Banco de Piezas Desordenadas -->
  <div id="pieces-bank" class="pieces-bank"></div>

  <script>
    // Arreglo con 10 imágenes disponibles
    const PUZZLES = [
      'https://github.com/EndersonSivira/Rompecabezas-dennis/raw/main/IMG-20260930-WA0021.jpg',
      'https://w0.peakpx.com/wallpaper/922/128/HD-wallpaper-cute-love-cartoon-romantic-lovers-couple-in-love-thumbnail.jpg',
      'https://i.pinimg.com/originals/98/b9/33/98b933ab29300647a4cbbccfadcd42be.jpg',
      'https://img.magnific.com/foto-gratis/personajes-anime-tomas-medias-abrazandose_23-2150970885.jpg?semt=ais_hybrid&w=740&q=80',
      'https://w0.peakpx.com/wallpaper/979/806/HD-wallpaper-anime-couple-top-best-anime-couple.jpg',
      'https://i.pinimg.com/736x/76/ec/f6/76ecf63590e8f06b4ac1c8b17c39f4ce.jpg',
      'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxPEbCMwTYW721anLG-eEmvetIZdizv5PdllGXtZflNQ&s=10',
      'https://i.pinimg.com/736x/bd/78/6b/bd786b9ebdd90c9e410fbd45fdb96d18.jpg',
      'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcDs4uLQfpcrgb4OlY4yv_ov314scRozykX0GyWr1K-g&s=10',
      'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSyvDQ1cLmGBMmBxpUhcgqW5i5gEn9pC5iQH6huYDA8gbIt-fIuvRF2Fd0&s=10'
    ];

    // Configuración fija en MODO DÍFICIL (5x6)
    const cols = 5;
    const rows = 6;
    const totalPieces = cols * rows;

    let selectedImageIndex = 0;
    let placedCount = 0;
    let timerInterval = null;
    let secondsElapsed = 0;
    let selectedPiece = null;

    const boardEl = document.getElementById('board');
    const bankEl = document.getElementById('pieces-bank');
    const timerEl = document.getElementById('timer');
    const progressEl = document.getElementById('progress');
    const startOverlay = document.getElementById('start-overlay');
    const winOverlay = document.getElementById('win-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalTimeEl = document.getElementById('final-time');
    const selectorContainer = document.getElementById('puzzle-selector');

    // Generar dinámicamente las 10 miniaturas en la galería
    PUZZLES.forEach((url, idx) => {
      const thumb = document.createElement('div');
      thumb.classList.add('puzzle-thumb');
      if (idx === 0) thumb.classList.add('active');
      thumb.style.backgroundImage = `url('${url}')`;
      thumb.dataset.index = idx;

      thumb.addEventListener('click', () => {
        document.querySelectorAll('.puzzle-thumb').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
        selectedImageIndex = idx;
      });

      selectorContainer.appendChild(thumb);
    });

    // Web Audio API para efectos de sonido
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'select') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'snap') {
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function initGame() {
      placedCount = 0;
      secondsElapsed = 0;
      selectedPiece = null;
      
      progressEl.textContent = '0%';
      timerEl.textContent = '00:00';
      clearInterval(timerInterval);

      boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      boardEl.innerHTML = '';
      bankEl.innerHTML = '';

      const currentImageUrl = PUZZLES[selectedImageIndex];
      const pieces = [];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const index = r * cols + c;

          // Crear casilla en el tablero
          const slot = document.createElement('div');
          slot.classList.add('slot');
          slot.dataset.index = index;
          slot.addEventListener('click', () => handleSlotClick(slot));
          boardEl.appendChild(slot);

          // Crear pieza
          const piece = document.createElement('div');
          piece.classList.add('piece');
          piece.dataset.index = index;

          const pieceWidth = Math.floor(260 / cols);
          const pieceHeight = Math.floor((260 * (16 / 9)) / rows);
          piece.style.width = `${pieceWidth}px`;
          piece.style.height = `${pieceHeight}px`;

          const bgPosX = (c / (cols - 1)) * 100;
          const bgPosY = (r / (rows - 1)) * 100;
          piece.style.backgroundImage = `url('${currentImageUrl}')`;
          piece.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
          piece.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;

          piece.addEventListener('click', (e) => {
            e.stopPropagation();
            handlePieceClick(piece);
          });

          pieces.push(piece);
        }
      }

      pieces.sort(() => Math.random() - 0.5);
      pieces.forEach(p => bankEl.appendChild(p));

      startOverlay.classList.add('hidden');
      winOverlay.classList.add('hidden');
      timerInterval = setInterval(updateTimer, 1000);
    }

    function handlePieceClick(piece) {
      if (piece.classList.contains('placed')) return;

      if (selectedPiece === piece) {
        piece.classList.remove('selected');
        selectedPiece = null;
      } else {
        if (selectedPiece) {
          selectedPiece.classList.remove('selected');
        }
        selectedPiece = piece;
        selectedPiece.classList.add('selected');
        playSound('select');
      }
    }

    function handleSlotClick(slot) {
      if (!selectedPiece) return;

      const pieceIndex = selectedPiece.dataset.index;
      const slotIndex = slot.dataset.index;

      if (pieceIndex === slotIndex && slot.children.length === 0) {
        selectedPiece.classList.remove('selected');
        selectedPiece.classList.add('placed');
        slot.appendChild(selectedPiece);
        
        placedCount++;
        playSound('snap');
        selectedPiece = null;

        const percentage = Math.floor((placedCount / totalPieces) * 100);
        progressEl.textContent = `${percentage}%`;

        if (placedCount === totalPieces) {
          handleWin();
        }
      }
    }

    function updateTimer() {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
    }

    function handleWin() {
      clearInterval(timerInterval);
      playSound('win');
      finalTimeEl.textContent = timerEl.textContent;
      winOverlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', () => {
      winOverlay.classList.add('hidden');
      startOverlay.classList.remove('hidden');
    });
  </script>
</body>
</html>
